<script>
        // ViewContent no carregamento
        document.addEventListener('DOMContentLoaded', function() {
            var vcEventId = window.fbEventId + '-vc';
            fbq('track', 'ViewContent', {
                content_name: '9 años de promoción Free Fire',
                content_category: '9 años de fuego libre'
            }, {eventID: vcEventId});
            window.sendCAPI('ViewContent', vcEventId, {content_name: '9 años de promoción Free Fire'});
        });
        
        // Modal VSL
        const vslModal = document.getElementById('vslModal');
        const closeVslModal = document.getElementById('closeVslModal');
        const vslVideo = document.getElementById('vslVideo');
        const playOverlay = document.getElementById('playOverlay');
        const playBtn = document.getElementById('playBtn');
        
        // Clica no botão play
        playOverlay.addEventListener('click', function() {
            playOverlay.style.opacity = '0';
            setTimeout(() => {
                playOverlay.style.display = 'none';
            }, 300);
            vslVideo.play();
        });
        
        // Fecha o modal
        function fecharModal() {
            vslModal.style.display = 'none';
            vslVideo.pause();
        }
        
        // Clique no botão fechar
        closeVslModal.addEventListener('click', fecharModal);
        
        // Clique fora do vídeo fecha o modal
        vslModal.addEventListener('click', function(e) {
            if (e.target === vslModal) {
                fecharModal();
            }
        });
        
        // ESC fecha o modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && vslModal.style.display !== 'none') {
                fecharModal();
            }
        });
        
        // Quando o vídeo terminar, fecha o modal automaticamente
        vslVideo.addEventListener('ended', function() {
            fecharModal();
        });
    </script>
