<script>
        // Sons gerados via Web Audio API (não precisa de arquivos externos)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playAcerto() {
            const notas = [523.25, 659.25, 783.99]; // C5, E5, G5
            notas.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.12);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime + i * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.25);
                osc.start(audioCtx.currentTime + i * 0.12);
                osc.stop(audioCtx.currentTime + i * 0.12 + 0.3);
            });
        }

        function playErro() {
            const notas = [300, 220]; // notas graves descendentes
            notas.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.18);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.18);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.18 + 0.3);
                osc.start(audioCtx.currentTime + i * 0.18);
                osc.stop(audioCtx.currentTime + i * 0.18 + 0.35);
            });
        }

        // Dados do quiz (do PHP)
        const questions = [{"question":"¿Cuántos años cumple Free Fire en este aniversario?","options":["7 años","8 años","9 años","10 años"],"correct":2},{"question":"¿Qué empresa es responsable de Free Fire?","options":["Garena","Riot Games","Epic Games","Tencent"],"correct":0},{"question":"¿Cuál es la moneda premium que se compra con dinero real en Free Fire?","options":["Ouro","Gemas","diamantes","Fichas"],"correct":2},{"question":"¿Cómo se llama la zona segura que se reduce durante el partido?","options":["Círculo","Zona","Domo","Escudo"],"correct":0},{"question":"¿Cuántos jugadores como máximo entran en un partido clásico?","options":["40","60","100","50"],"correct":3},{"question":"¿Cuál de estos es un personaje clásico y popular de Free Fire?","options":["Alok","Kratos","Master Chief","Mario"],"correct":0},{"question":"¿Cuál es el mapa más clásico y conocido de Free Fire?","options":["Kalahari","Purgatorio","Bermuda","Alpes"],"correct":2},{"question":"¿Qué suelen celebrar los jugadores cada aniversario de FF?","options":["Fin del juego","Novos servidores","Eventos y recompensas","aumento de precio"],"correct":2}];
        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        // Elementos
        const quizContainer = document.getElementById('quizContainer');
        const resultContainer = document.getElementById('resultContainer');

        // Carregar pergunta
        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                showResults();
                return;
            }

            answered = false;
            const q = questions[currentQuestion];
            
            let optionsHTML = '';
            q.options.forEach((option, index) => {
                optionsHTML += `
                    <div class="ff-quiz-option p-4 mb-3 flex items-center gap-4" 
                         data-index="${index}" onclick="selectAnswer(${index})">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center font-orbitron font-bold text-black shrink-0" style="background: linear-gradient(135deg, #FF6B00, #FFD700);">
                            ${String.fromCharCode(65 + index)}
                        </div>
                        <span class="text-white text-lg" style="text-shadow: 0 1px 4px rgba(0,0,0,0.2);">${option}</span>
                    </div>
                `;
            });

            quizContainer.innerHTML = `
                <div class="animate-fade-in">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="ff-question-number w-12 h-12 rounded-full flex items-center justify-center font-orbitron font-black text-xl">
                            ${currentQuestion + 1}
                        </div>
                        <span class="text-white/80 font-orbitron text-sm tracking-wider" style="text-shadow: 0 2px 8px rgba(0,0,0,0.2);">PERGUNTA ${currentQuestion + 1} DE ${questions.length}</span>
                    </div>
                    
                    <h2 class="text-2xl font-bold text-white mb-8" style="text-shadow: 0 2px 10px rgba(0,0,0,0.3);">${q.question}</h2>
                    
                    <div id="options">
                        ${optionsHTML}
                    </div>
                </div>
            `;
        }

        // Selecionar resposta
        function selectAnswer(index) {
            if (answered) return;
            answered = true;

            // Marcar opção selecionada
            const options = document.querySelectorAll('.ff-quiz-option');
            options[index].classList.add('selected');

            // Determine if correct
            const isCorrect = index === questions[currentQuestion].correct;
            
            const optionsNodes = document.querySelectorAll('.ff-quiz-option');
                
            optionsNodes.forEach((option, i) => {
                option.style.pointerEvents = 'none';
                
                if (i === index && !isCorrect) {
                    option.classList.add('incorrect');
                }
                if (i === questions[currentQuestion].correct) {
                    option.classList.add('correct');
                }
            });

            // Atualizar pontuação
            if (isCorrect) {
                score++;
            }

            // Efeito sonoro e visual
            if (isCorrect) {
                playAcerto();
                showFeedback('¡Correcto!', 'success');
            } else {
                playErro();
                showFeedback('¡Incorrecto!', 'error');
            }

            // Avançar automaticamente após 1.5 segundos
            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 1500);
        }

        // Mostrar feedback
        function showFeedback(message, type) {
            const isCorrect = type === 'success';
            const colorClass = isCorrect ? 'text-green-400' : 'text-red-400';
            const colorHex = isCorrect ? '#4ade80' : '#f87171';
            const iconText = isCorrect ? '✓ ¡Correcto!' : '✗ ¡Incorrecto!';
            
            const feedback = document.createElement('div');
            feedback.className = `text-center text-2xl font-orbitron font-bold ${colorClass} mt-4 animate-fade-in`;
            feedback.style.color = colorHex;
            feedback.textContent = iconText;
            document.getElementById('options').appendChild(feedback);
        }

        // Mostrar resultados
        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            
            document.getElementById('finalScore').textContent = score;
            
            let message = '';
            const percentage = (score / questions.length) * 100;
            
            if (percentage === 100) {
                message = '¡Increíble! ¡Eres una verdadera leyenda de Free Fire! 🎉🔥';
            } else if (percentage >= 80) {
                message = '¡Excelente! ¡Sabes mucho sobre Free Fire! 🎂';
            } else if (percentage >= 60) {
                message = '¡Muy bien! ¡Sigues bien la historia de Free Fire!';
            } else if (percentage >= 40) {
                message = '¡Buen esfuerzo! ¡Sigue celebrando los 9 años de Free Fire!';
            } else {
                message = '¡Necesitas conocer mejor la historia de Free Fire!';
            }
            
            document.getElementById('resultMessage').textContent = message;

            // Salvar pontuação na sessão para a roleta
            sessionStorage.setItem('quizScore', score);
            sessionStorage.setItem('quizCompleted', 'true');
        }

        // Resetar quiz
        function resetQuiz() {
            currentQuestion = 0;
            score = 0;
            // scoreElement e progressBar removidos, não existem no código
            
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            
            loadQuestion();
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            loadQuestion();
        });
    </script>
