<style>

<script>
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const prizeModal = document.getElementById('prizeModal');
        const loseModal = document.getElementById('loseModal');
        // Sons gerados via Web Audio API (não precisa de arquivos externos)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let spinInterval = null;

        function playTick() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function startSpinSound() {
            let delay = 80;
            let count = 0;
            function tick() {
                playTick();
                count++;
                // começa rápido e vai desacelerando
                if (count < 20) delay = 80;
                else if (count < 40) delay = 130;
                else if (count < 55) delay = 200;
                else delay = 320;
                if (count < 60) spinInterval = setTimeout(tick, delay);
            }
            tick();
        }

        function stopSpinSound() {
            if (spinInterval) { clearTimeout(spinInterval); spinInterval = null; }
        }

        function playGanhou() {
            const notas = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
            notas.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.4);
                osc.start(audioCtx.currentTime + i * 0.15);
                osc.stop(audioCtx.currentTime + i * 0.15 + 0.45);
            });
        }
        let isSpinning = false;
        let currentRotation = 0;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.style.pointerEvents = 'none';

            // Lógica Local (Substitui o fetch)
            let attempts = parseInt(sessionStorage.getItem("spinAttempts") || "0");
            if (attempts >= 2) attempts = 0; // Para permitir testes contínuos
            attempts++;
            sessionStorage.setItem("spinAttempts", attempts.toString());

            let targetAngle, isWinner, prize;
            
            if (attempts === 1) {
                // Primeira tentativa (cai no centro de 0%)
                targetAngle = 337.5;
                isWinner = false;
            } else {
                // Segunda tentativa (cai na divisa entre 90% e 100%)
                targetAngle = 45; 
                isWinner = true;
                prize = { name: "90% OFF!" };
            }

            // Calcula o quanto falta para atingir o ângulo desejado
            let currentMod = currentRotation % 360;
            let diff = targetAngle - currentMod;
            if (diff <= 0) diff += 360;
            
            // Adiciona 5 voltas completas mais a diferença
            let angle = 360 * 5 + diff;

            // Atualiza ângulo
            currentRotation += angle;
            wheel.style.transition = "transform 6s cubic-bezier(0.17, 0.67, 0.12, 0.99)";
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            startSpinSound();

            setTimeout(() => {
                stopSpinSound();
                if (isWinner) {
                    showWinPrize(prize);
                } else {
                    showLoseModal();
                }
                isSpinning = false;
                spinBtn.style.pointerEvents = "auto";
            }, 6200);
        }

        function showLoseModal() {
            loseModal.classList.add('active');
        }

        function closeLoseModal() {
            loseModal.classList.remove('active');
        }

        function showWinPrize(prize) {
            document.getElementById('prizeName').textContent = prize.name;
            prizeModal.classList.add('active');
            playGanhou();

            // Criar confetes
            createConfetti();

            // Salvar prêmio para a loja
            sessionStorage.setItem('wonPrize', JSON.stringify(prize));
        }

        function closeModal() {
            prizeModal.classList.remove('active');
        }

        function createConfetti() {
            const colors = ['#FF6B00', '#FFD700', '#FFD700', '#C2410C', '#FF8C00', '#FF8C00'];

            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';

                    document.body.appendChild(confetti);

                    // Animação de queda
                    const animation = confetti.animate([
                        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                        { transform: `translateY(100vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                    ], {
                        duration: Math.random() * 2000 + 2000,
                        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                    });

                    animation.onfinish = () => confetti.remove();
                }, i * 30);
            }
        }
    </script>
